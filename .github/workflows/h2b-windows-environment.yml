name: H2b Windows environment probe

on:
  pull_request:
    branches:
      - implementation/full-build
    paths:
      - ".github/workflows/h2b-windows-environment.yml"
      - "experiments/phase-1/H2b-exe-deferred/README.md"
  push:
    branches:
      - implementation/full-build
    paths:
      - ".github/workflows/h2b-windows-environment.yml"
      - "experiments/phase-1/H2b-exe-deferred/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h2b-windows-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-environment:
    name: Windows toolchain and WebView2
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          targets: x86_64-pc-windows-msvc

      - name: Capture and verify Windows build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $node = node --version
          if ($node -ne "v22.16.0") {
            throw "Unexpected Node.js version: $node"
          }

          $rust = rustc --version
          $cargo = cargo --version
          $target = rustup target list --installed
          if ($target -notcontains "x86_64-pc-windows-msvc") {
            throw "The MSVC Rust target is not installed."
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "Visual Studio Installer vswhere.exe was not found."
          }

          $vsPath = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) {
            throw "A Visual Studio installation with the x64 C++ build tools was not found."
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) {
            throw "The x64 MSVC environment script was not found."
          }

          $compilerOutput = & cmd.exe /c "`"$vcvars`" >nul && cl"
          if ($LASTEXITCODE -ne 0) {
            throw "The MSVC compiler could not be initialized."
          }
          $compilerVersion = ($compilerOutput | Select-String -Pattern "Compiler Version" | Select-Object -First 1).Line

          $webViewRoots = @(
            "C:\Program Files (x86)\Microsoft\EdgeWebView\Application",
            "C:\Program Files\Microsoft\EdgeWebView\Application"
          )
          $webViewVersions = @(
            foreach ($root in $webViewRoots) {
              if (Test-Path $root) {
                Get-ChildItem -Path $root -Directory | Select-Object -ExpandProperty Name
              }
            }
          )
          if ($webViewVersions.Count -eq 0) {
            throw "The Evergreen WebView2 Runtime was not found."
          }

          $report = @(
            "Runner image: windows-2025"
            "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
            "Node.js: $node"
            "Rust: $rust"
            "Cargo: $cargo"
            "Rust target: x86_64-pc-windows-msvc"
            "Visual Studio: $vsPath"
            "MSVC: $compilerVersion"
            "WebView2 Runtime: $($webViewVersions -join ', ')"
          ) -join "`n"

          $report | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\h2b-windows-environment.txt"
          $report | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload environment evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: h2b-windows-environment
          path: h2b-windows-environment.txt
          if-no-files-found: error
          retention-days: 30
