name: Fluently CI
on:
  push:
    branches:
      - implementation/full-build
  pull_request:
    branches:
      - main
      - implementation/full-build
permissions:
  contents: read
concurrency:
  group: fluently-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.16.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript checks
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Secret-pattern scan
        run: pnpm run security:check
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high
      - name: Validate curriculum drafts
        run: pnpm run content:validate
      - name: Build learner and admin applications
        run: pnpm run build

  windows-h2b-environment:
    name: H2b Windows toolchain and WebView2
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          targets: x86_64-pc-windows-msvc

      - name: Capture and verify Windows build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $node = node --version
          if ($node -ne "v22.16.0") {
            throw "Unexpected Node.js version: $node"
          }

          $rust = rustc --version
          $cargo = cargo --version
          $target = rustup target list --installed
          if ($target -notcontains "x86_64-pc-windows-msvc") {
            throw "The MSVC Rust target is not installed."
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "Visual Studio Installer vswhere.exe was not found."
          }

          $vsPath = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) {
            throw "A Visual Studio installation with the x64 C++ build tools was not found."
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) {
            throw "The x64 MSVC environment script was not found."
          }

          $compilerOutput = & cmd.exe /c "`"$vcvars`" >nul && cl" 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "The MSVC compiler could not be initialized."
          }
          $compilerVersion = ($compilerOutput | Select-String -Pattern "Compiler Version" | Select-Object -First 1).Line

          $webViewRoots = @(
            "C:\Program Files (x86)\Microsoft\EdgeWebView\Application",
            "C:\Program Files\Microsoft\EdgeWebView\Application"
          )
          $webViewVersions = @(
            foreach ($root in $webViewRoots) {
              if (Test-Path $root) {
                Get-ChildItem -Path $root -Directory | Select-Object -ExpandProperty Name
              }
            }
          )
          if ($webViewVersions.Count -eq 0) {
            throw "The Evergreen WebView2 Runtime was not found."
          }

          $report = @(
            "Runner image: windows-2025"
            "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
            "Node.js: $node"
            "Rust: $rust"
            "Cargo: $cargo"
            "Rust target: x86_64-pc-windows-msvc"
            "Visual Studio: $vsPath"
            "MSVC: $compilerVersion"
            "WebView2 Runtime: $($webViewVersions -join ', ')"
          ) -join "`n"

          $report | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\h2b-windows-environment.txt"
          $report | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload environment evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: h2b-windows-environment
          path: h2b-windows-environment.txt
          if-no-files-found: error
          retention-days: 30

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.16.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.4

      - name: Generate temporary Windows build icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing
          $iconDirectory = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/icons"
          New-Item -ItemType Directory -Force -Path $iconDirectory | Out-Null
          $bitmap = [System.Drawing.Bitmap]::new(32, 32)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(24, 72, 112))
          $graphics.Dispose()
          $handle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create((Join-Path $iconDirectory "icon.ico"))
          try { $icon.Save($stream) } finally {
            $stream.Dispose()
            $icon.Dispose()
            $bitmap.Dispose()
          }

      - name: Verify Cargo dependencies against committed lockfile
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Build Windows QA installer and executable
        working-directory: apps/desktop/src-tauri
        run: tauri build

      - name: Install and launch Windows QA application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerDirectory = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $installerDirectory -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable; found $($installers.Count)."
          }
          pwsh -NoProfile -ExecutionPolicy Bypass -File "scripts/windows/qa-install-smoke.ps1" -InstallerPath $installers[0].FullName

      - name: Upload unsigned Windows QA installer and executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fluently-windows-unsigned-qa
          path: |
            apps/desktop/src-tauri/target/release/fluently-desktop.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows install/runtime smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: h2b-windows-install-smoke
          path: h2b-windows-install-smoke.txt
          if-no-files-found: error
          retention-days: 30

      - name: Archive committed Cargo lockfile for build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fluently-windows-cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14
