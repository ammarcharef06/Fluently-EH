name: Fluently CI
on:
  push:
    branches:
      - implementation/full-build
  pull_request:
    branches:
      - main
      - implementation/full-build
permissions:
  contents: read
concurrency:
  group: fluently-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.16.1
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Export regenerated lockfile for dependency maintenance
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[lockfile-refresh]')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-pnpm-lock-${{ github.event.pull_request.number }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Verify generated lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript checks
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Secret-pattern scan
        run: pnpm run security:check
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high
      - name: Validate curriculum drafts
        run: pnpm run content:validate
      - name: Build learner and admin applications
        run: pnpm run build
      - name: Install Chromium for browser acceptance
        run: pnpm --filter @fluently/web exec playwright install --with-deps chromium
      - name: Web/PWA offline browser acceptance
        run: pnpm --filter @fluently/web test:e2e
