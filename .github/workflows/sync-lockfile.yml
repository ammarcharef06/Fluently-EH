name: Sync pnpm lockfile
on:
  push:
    branches:
      - implementation/full-build
    paths-ignore:
      - pnpm-lock.yaml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fluently-lockfile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/implementation/full-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.16.1
      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'pnpm-lock.yaml is unchanged.'
            exit 0
          fi
          git commit -m 'chore: generate pnpm workspace lockfile'
          git push origin "HEAD:${GITHUB_REF_NAME}"
