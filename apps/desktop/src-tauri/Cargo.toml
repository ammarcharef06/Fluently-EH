[package]
name = "fluently-desktop"
version = "0.1.0"
description = "Fluently Windows desktop application"
authors = ["Fluently contributors"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10.9"
tauri = { version = "2.12.5" }
